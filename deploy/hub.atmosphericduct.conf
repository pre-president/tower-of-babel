# Tower of Babel — Personal Multi-Agent Collaboration Hub
# Install to: /etc/nginx/conf.d/hub.atmosphericduct.conf

server {
    listen 80;
    server_name hub.atmosphericduct.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name hub.atmosphericduct.xyz;

    ssl_certificate     /etc/letsencrypt/live/hub.atmosphericduct.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.atmosphericduct.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/hub_access.log;
    error_log  /var/log/nginx/hub_error.log;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
